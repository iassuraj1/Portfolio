<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1d"/>
      <stop offset="50%" stop-color="#080a14"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Vibrant S Gradient matching portfolio primary/neon/secondary -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Dark Glassmorphism -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Ambient Light Spot -->
  <circle cx="50" cy="50" r="28" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- Glowing S Shadow Layer -->
  <path d="M 68 29 C 68 17 32 17 32 34 C 32 48 68 52 68 66 C 68 83 32 83 32 71"
        fill="none"
        stroke="#8b5cf6"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.45"
        filter="url(#glow)" />

  <!-- Main S Stroke Layer -->
  <path d="M 68 29 C 68 17 32 17 32 34 C 32 48 68 52 68 66 C 68 83 32 83 32 71"
        fill="none"
        stroke="url(#sGrad)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Crisp Highlight Tip -->
  <circle cx="68" cy="29" r="2.5" fill="#ffffff" opacity="0.85" />
</svg>